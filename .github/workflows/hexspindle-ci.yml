name: HexSpindle CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser-smoke-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tools

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: node ci-smoke.mjs

  deploy-pages:
    name: Deploy website
    needs: browser-smoke-test

    # Only deploy successful pushes to main.
    # Pull requests will run CI but will never receive the deployment key.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    concurrency:
      group: hexspindle-pages-deploy
      cancel-in-progress: true

    steps:
      - name: Check out HexSpindle source
        uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false

      - name: Check out Pages repository
        uses: actions/checkout@v7
        with:
          repository: HexSpindle/HexSpindle.github.io
          ref: main
          path: site
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}

      - name: Sync deployable application files
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tools/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            source/ site/

      - name: Commit and push deployment
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No website changes to deploy."
            exit 0
          fi

          git commit -m "Deploy HexSpindle ${GITHUB_SHA:0:7}"
          git push origin main
