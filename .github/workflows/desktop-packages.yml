name: Desktop portable packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - run: node tools/build-site.mjs --out dist
      - name: Install Playwright Chromium
        working-directory: tools
        run: npx playwright install --with-deps chromium
      - name: Smoke test distribution
        run: node tools/ci-dist-smoke.mjs --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: production-site
          path: dist/
          retention-days: 7
  package:
    needs: build-site
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, goos: windows, goarch: amd64, suffix: .exe}
          - {os: ubuntu-latest, goos: windows, goarch: arm64, suffix: .exe}
          - {os: macos-latest, goos: darwin, goarch: amd64, suffix: ''}
          - {os: macos-latest, goos: darwin, goarch: arm64, suffix: ''}
          - {os: ubuntu-latest, goos: linux, goarch: amd64, suffix: ''}
          - {os: ubuntu-latest, goos: linux, goarch: arm64, suffix: ''}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: production-site
          path: desktop/launcher/site
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Compile self-contained launcher
        working-directory: desktop/launcher
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w' -o HexSpindle-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} .
      - name: Smoke test native executable
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        working-directory: desktop/launcher
        run: |
          set -euo pipefail
          HEXSPINDLE_NO_BROWSER=1 ./HexSpindle-linux-amd64 > server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            url=$(grep -oE 'http://127\.0\.0\.1:[0-9]+/' server.log | head -1 || true)
            if [[ -n "$url" ]] && curl --fail --silent "$url" | grep -qi 'html'; then break; fi
            sleep 0.25
          done
          test -n "${url:-}"
          curl --fail --silent "${url}HexSpindle.js" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: HexSpindle-${{ matrix.goos }}-${{ matrix.goarch }}
          path: desktop/launcher/HexSpindle-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: HexSpindle-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum HexSpindle-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
